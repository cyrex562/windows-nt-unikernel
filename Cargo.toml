[workspace]
resolver = "2"

members = [
    "crates/pe-loader",
    "crates/kernel",
    "crates/api-shim",
    "crates/common",
]

[workspace.package]
version = "0.1.0"
authors = ["Windows NT Unikernel Contributors"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# PE parsing
goblin = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization (for configs, debugging)
serde = { version = "1.0", features = ["derive"], default-features = false }

# Logging
log = "0.4"

# Bare-metal / no_std dependencies
bitflags = "2.4"
spin = "0.9"           # Spinlocks for no_std
lazy_static = { version = "1.4", features = ["spin_no_std"] }
volatile = "0.5"       # Volatile memory operations

# Bootloader (for Phase 2)
bootloader = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
