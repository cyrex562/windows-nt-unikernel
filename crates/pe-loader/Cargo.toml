[package]
name = "pe-loader"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pe-loader"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
goblin.workspace = true
anyhow.workspace = true
log.workspace = true

# For userspace prototype (Phase 1)
env_logger = "0.11"
memmap2 = "0.9"        # Memory mapping
libc = "0.2"           # For mmap/mprotect

[features]
default = ["std"]
std = []
